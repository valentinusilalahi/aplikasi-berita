spring:
  application:
    name: news-system
  
  datasource:
    url: jdbc:postgresql://localhost:5434/sinodal_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Jakarta

jwt:
  secret: your-secret-key-change-this-in-production-at-least-256-bits-long-please
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.news: DEBUG
    org.springframework.security: DEBUG
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# File upload configuration
file:
  upload-dir: ./uploads
  allowed-extensions: jpg,jpeg,png,pdf,doc,docx,txt
  max-size: 52428800 # 50MB