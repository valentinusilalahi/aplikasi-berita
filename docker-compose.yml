version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: news_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/news_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: your-secret-key-change-this-in-production-at-least-256-bits-long-please
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - news-network
    profiles:
      - with-app

  frontend:
    image: node:18-alpine
    container_name: news_frontend
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    depends_on:
      - app
    networks:
      - news-network
    profiles:
      - with-frontend

volumes:
  postgres_data:

networks:
  news-network:
    driver: bridge
